name: Publish to npm

on:
  push:
    branches: [main]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v6

      # registry-url を指定しないこと。
      # 指定すると setup-node が .npmrc に
      #   //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}
      # を書き込む。npm CLI はその行を見て「認証は設定済み」と判断し、
      # Trusted Publishing (OIDC) の token 交換を一切開始しないまま
      # そのトークンで publish しようとする（actions/setup-node#1551）。
      # 依存は全て public なので既定レジストリで npm ci は通る。
      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      # Trusted Publishing (OIDC) は npm CLI 11.5.1 以上が必要。
      # Node 22 同梱は 10.9 系なので明示的に上げる。
      - name: Upgrade npm (OIDC trusted publishing requires >= 11.5.1)
        run: |
          npm install -g npm@latest
          npm --version

      - name: Build
        run: |
          npm ci
          npm run build

      - name: Check if version already published
        id: check
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "n8n-nodes-reportflow@${VERSION}" version 2>/dev/null; then
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      # NODE_AUTH_TOKEN は渡さない。トークンが見えると OIDC が使われない。
      # 認証は id-token: write による Trusted Publishing のみ。
      # provenance は OIDC publish では自動で付くが、明示しておく。
      - name: Publish to npm
        if: steps.check.outputs.skip == 'false'
        run: npm publish --access public --provenance
