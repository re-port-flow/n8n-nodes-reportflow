name: Publish to npm

on:
  push:
    branches: [main]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      # npm の Trusted Publishing (OIDC) は npm CLI 11.5.1 以上でしか動かない。
      # Node 22 同梱は 10.9 系なので、ここで上げないと OIDC が使われず
      # NODE_AUTH_TOKEN にフォールバックし、2FA ポリシーで E403 になる。
      - name: Upgrade npm (OIDC trusted publishing requires >= 11.5.1)
        run: |
          npm install -g npm@latest
          npm --version

      - name: Build
        run: |
          npm ci
          npm run build

      - name: Check if version already published
        id: check
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "n8n-nodes-reportflow@${VERSION}" version 2>/dev/null; then
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Publish to npm
        if: steps.check.outputs.skip == 'false'
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
