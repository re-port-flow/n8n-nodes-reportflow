name: Publish to npm

on:
  push:
    branches: [main]

jobs:
  publish:
    runs-on: ubuntu-latest
    # 認証は Trusted Publishing (OIDC) のみ。NPM_TOKEN は使わない。
    # npmjs.com で Trusted Publisher (re-port-flow / n8n-nodes-reportflow / publish.yml)
    # を登録してあることが前提。未登録だと OIDC 交換が 404 → ENEEDAUTH（実測 2026-08-23）。
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v6

      # registry-url を指定しないこと。指定すると setup-node が .npmrc に
      # _authToken=${NODE_AUTH_TOKEN} を書き込み、npm が OIDC を使わない（actions/setup-node#1551）。
      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      # OIDC は npm CLI 11.5.1 以上が必要。Node 22 同梱は 10.9 系。
      - name: Upgrade npm (OIDC trusted publishing requires >= 11.5.1)
        run: |
          npm install -g npm@11
          npm --version

      - name: Build
        run: |
          npm ci
          npm run build

      - name: Check if version already published
        id: check
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "n8n-nodes-reportflow@${VERSION}" version 2>/dev/null; then
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      # NODE_AUTH_TOKEN は渡さない。OIDC publish では provenance は自動で付く。
      - name: Publish to npm
        if: steps.check.outputs.skip == 'false'
        run: npm publish --access public
