name: Publish to npm

on:
  push:
    branches: [main]

jobs:
  publish:
    runs-on: ubuntu-latest
    # id-token: write を付けない。付けると npm CLI が Trusted Publishing (OIDC)
    # の token 交換を試み、このパッケージは未登録なので 404 で失敗したうえで
    # トークンにフォールバックし、publish が「direct publishing」扱いになって
    # 2FA ポリシーで E403 になる（実測 2026-08-23）。
    # 同じ org・同じ NPM_TOKEN で通っている re-port-flow/reportflow-mcp の
    # publish.yml が id-token/--provenance のどちらも使っていないので、それに揃える。
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Build
        run: |
          npm ci
          npm run build

      - name: Check if version already published
        id: check
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "n8n-nodes-reportflow@${VERSION}" version 2>/dev/null; then
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      # --provenance を付けない（reportflow-mcp と同じ）。
      # provenance を戻すなら Trusted Publisher を登録してからにすること。
      - name: Publish to npm
        if: steps.check.outputs.skip == 'false'
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
