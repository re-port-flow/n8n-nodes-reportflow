name: Publish to npm

on:
  push:
    branches: [main]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      # npm CLI 11.5.1 以上でないと Trusted Publishing (OIDC) が使えない。
      # Node 22 同梱は 10.9 系なので明示的に上げる。
      #
      # 実測 (2026-08-23): 12.0.2 に上げたうえで、npm CLI が使うのと同じ
      #   POST /-/npm/v1/oidc/token/exchange/package/n8n-nodes-reportflow
      # を叩くと HTTP 404 = このパッケージには Trusted Publisher が未登録。
      # そのため現状は下の NODE_AUTH_TOKEN 経路で publish する。
      #
      # npmjs.com 側で Trusted Publisher を登録したら、registry-url と
      # NODE_AUTH_TOKEN の両方を外すこと。setup-node は registry-url 指定時に
      # .npmrc へ `_authToken=${NODE_AUTH_TOKEN}` を書き込み、npm はその行を見て
      # 「認証済み」と判断して OIDC を使わない (actions/setup-node#1551)。
      - name: Upgrade npm (OIDC trusted publishing requires >= 11.5.1)
        run: |
          npm install -g npm@latest
          npm --version

      - name: Build
        run: |
          npm ci
          npm run build

      - name: Check if version already published
        id: check
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "n8n-nodes-reportflow@${VERSION}" version 2>/dev/null; then
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Publish to npm
        if: steps.check.outputs.skip == 'false'
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
